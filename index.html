function getCentroColor(name) {
  if(CENTRO_COLORS[name]) return CENTRO_COLORS[name];
  const idx = Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0)) % EXTRA_COLORS.length;
  return EXTRA_COLORS[idx];
}

// ── FERIADOS CHILE AUTOMÁTICOS ────────────────────────────────
function feriadosChile(y) {
  const fer = new Set();
  const fstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const add = (m, d) => fer.add(fstr(new Date(y, m-1, d)));

  add(1,1);   // Año Nuevo
  add(5,1);   // Día del Trabajo
  add(5,21);  // Glorias Navales
  const diaPueblos = (y % 4 === 0 && y > 2044) ? 20 : 21;
  add(6, diaPueblos);
  add(7,16);  // Virgen del Carmen
  add(8,15);  // Asunción de la Virgen
  add(9,18);  // Independencia
  add(9,19);  // Glorias del Ejército
  add(11,1);  // Todos los Santos
  add(12,8);  // Inmaculada Concepción
  add(12,25); // Navidad

  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
    const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
    const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
    const mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
    return new Date(y,mo-1,dy);
  }
  const ep = easter(y);
  const shift = (days) => { const x = new Date(ep); x.setDate(ep.getDate()+days); fer.add(fstr(x)); };
  shift(-2); // Viernes Santo
  shift(-1); // Sábado Santo

  const trasladaLey19668 = (mes, dia) => {
    const base = new Date(y, mes-1, dia);
    const dw = base.getDay();
    let out = base;
    if (dw >= 2 && dw <= 4) {
      out = new Date(base); out.setDate(dia - (dw - 1));
    } else if (dw === 5) {
      out = new Date(base); out.setDate(dia + 3);
    }
    fer.add(fstr(out));
  };
  trasladaLey19668(6, 29);
  trasladaLey19668(10, 12);

  (() => {
    const base = new Date(y, 9, 31);
    const dw = base.getDay();
    let out = base;
    if (dw === 2 || dw === 3) {
      out = new Date(y, 9, 27);
    }
    fer.add(fstr(out));
  })();

  return fer;
}

const FER_CACHE = {};
function getFer(y){ if(!FER_CACHE[y]) FER_CACHE[y] = feriadosChile(y); return FER_CACHE[y]; }
function esFeriado(f){
  const parts = String(f).split('-').map(Number);
  if(parts.length<3 || parts.some(isNaN)) return false;
  const [yy,mm,dd] = parts;
  const norm = `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  return getFer(yy).has(norm);
}

// ── LÓGICA DE TARIFAS UNIFICADA ──────────────────────────────
function tarifaDia(dateStr, settings) {
  const w = dateStr ? new Date(dateStr+"T12:00:00").getDay() : -1;
  const esSabado = w === 6;
  let horas = 0;
  if (w === 0)              horas = 0;
  else if (w === 5 || w === 6) horas = 4;
  else                      horas = 3;
  const valorHora = esSabado ? settings.valorSab : settings.valorLV;
  return {
    horas,
    esSabado,
    valorHora,
    tipo: esSabado ? "Sábado" : "Lun–Vie",
    total: horas * valorHora,
  };
}

function toSheetRow(r, mk, settings) {
  const t = tarifaDia(r.date, settings);
  return { ID: r.id||genId(), Fecha: r.date, Día: r.dia, Centro: r.centro, Horas: r.horas, Tipo: t.tipo, Mes: mk };
}
function normalizeDate(raw) {
  if(!raw) return "";
  const s = String(raw).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2) return m2[3]+"-"+m2[2].padStart(2,"0")+"-"+m2[1].padStart(2,"0");
  return s;
}
function fromSheetRow(row) {
  return {
    id:     row["ID"]     || row["id"]    || "",
    date:   normalizeDate(row["Fecha"]   || row["fecha"] || ""),
    dia:    row["Día"]    || row["Dia"]   || "",
    centro: row["Centro"] || row["centro"]|| "",
    horas:  Number(row["Horas"] || row["horas"] || 0),
  };
}
function parseSettings(raw) {
  const defaults = { valorLV:DEFAULT_VALOR_LV, valorSab:DEFAULT_VALOR_SAB, factor:DEFAULT_FACTOR, boleta:false, centros:DEFAULT_CENTROS };
  if(!raw || Object.keys(raw).length===0) return defaults;
  return {
    valorLV:  raw.valorLV  ? Number(raw.valorLV)  : defaults.valorLV,
    valorSab: raw.valorSab ? Number(raw.valorSab) : defaults.valorSab,
    factor:   raw.factor   ? Number(raw.factor)   : defaults.factor,
    boleta:   raw.boleta   === "true" || raw.boleta === true,
    centros:  raw.centros  ? (typeof raw.centros==="string" ? JSON.parse(raw.centros) : raw.centros) : defaults.centros,
  };
}

function exportToExcel(registros, year, month, settings) {
  const wb = XLSX.utils.book_new();
  const rows = [["N°","Fecha","Día","Centro","Tipo día","Horas","Valor hora","Total"]];
  registros.forEach((r,i) => {
    const t = tarifaDia(r.date, settings);
    rows.push([i+1, r.date.split("-").reverse().join("/"), r.dia, r.centro, t.tipo, r.horas, t.valorHora, r.horas*t.valorHora]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  ws1["!cols"] = [{wch:4},{wch:13},{wch:12},{wch:16},{wch:10},{wch:7},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws1, "Registros");
  const por = {};
  settings.centros.forEach(c => { por[c]={lv:0,sab:0}; });
  registros.forEach(r => {
    const t = tarifaDia(r.date, settings);
    if(!por[r.centro]) por[r.centro]={lv:0,sab:0};
    if(t.esSabado) por[r.centro].sab+=r.horas; else por[r.centro].lv+=r.horas;
  });
  let tLV=0,tSab=0;
  const rrows=[["Centro","Horas L–V","Horas Sáb","Total h","Valor L–V","Valor Sáb","Total $"]];
  settings.centros.forEach(c => {
    const {lv,sab}=por[c]||{lv:0,sab:0};
    if(!lv&&!sab) return;
    tLV+=lv; tSab+=sab;
    rrows.push([c,lv,sab,lv+sab,lv*settings.valorLV,sab*settings.valorSab,lv*settings.valorLV+sab*settings.valorSab]);
  });
  rrows.push([]);
  rrows.push(["TOTAL",tLV,tSab,tLV+tSab,tLV*settings.valorLV,tSab*settings.valorSab,tLV*settings.valorLV+tSab*settings.valorSab]);
  const ws2 = XLSX.utils.aoa_to_sheet(rrows);
  ws2["!cols"]=[{wch:16},{wch:12},{wch:12},{wch:10},{wch:13},{wch:13},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, "Resumen");
  XLSX.writeFile(wb, `Finanzas_${MONTHS[month]}_${year}.xlsx`);
}

function Calendar({ year, month, marked, selected, onSelect }) {
  const first = new Date(year,month,1).getDay();
  const days  = new Date(year,month+1,0).getDate();
  const cells = Array(first).fill(null);
  for(let d=1;d<=days;d++) cells.push(d);
  const str = d => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:8}}>
        {DAYS_SHORT.map(d=>(
          <div key={d} style={{textAlign:"center",fontSize:10,color:"#444",fontWeight:700,
            fontFamily:"'DM Mono',monospace",padding:"3px 0"}}>{d}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={i}/>;
          const s=str(d), reg=marked.get(s), isSel=s===selected;
          const w=new Date(s+"T12:00:00").getDay(), isDom=w===0;
          const isFer=esFeriado(s);
          const cc = reg ? getCentroColor(reg.centro) : null;
          const blocked = isDom || isFer;
          return (
            <button key={i} onClick={()=>!blocked&&onSelect(s)} style={{
              border: isSel?"2px solid #e8c84a":reg?`2px solid ${cc.border}`:isFer?"1.5px solid #3a1a1a":"1.5px solid transparent",
              borderRadius:10, padding:"7px 0", cursor:blocked?"default":"pointer",
              fontSize:12, fontWeight:reg?800:500, fontFamily:"'DM Mono',monospace",
              background: isSel?"#2a2510":reg?cc.bg:isFer?"#1a0a0a":w===6?"#141418":"#1e1e26",
              color: isSel?"#e8c84a":reg?cc.text:isDom?"#2a2a2a":isFer?"#5a2a2a":w===6?"#555":"#aaa",
              position:"relative",transition:"all .12s",
            }}>
              {d}
              {reg&&!isSel&&(
                <span style={{position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)",
                  width:5,height:5,borderRadius:"50%",background:cc.dot,display:"block"}}/>
              )}
            </button>
          );
        })}
      </div>
      {marked.size>0&&(
        <div style={{marginTop:12,padding:"8px 10px",background:"#1a1a22",borderRadius:8,
          display:"flex",flexWrap:"wrap",gap:6}}>
          {[...new Set([...marked.values()].map(r=>r.centro))].map(c=>{
            const cc=getCentroColor(c);
            const n=[...marked.values()].filter(r=>r.centro===c).length;
            return(
              <div key={c} style={{display:"flex",alignItems:"center",gap:4,
                padding:"3px 8px",borderRadius:20,background:cc.bg,border:`1px solid ${cc.border}`}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:cc.dot}}/>
                <span style={{fontSize:10,color:cc.text,fontWeight:700}}>{c.split(" ")[0]} · {n}d</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function BarChart({ data }) {
  const max = Math.max(...data.map(d=>d.value), 1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:8,height:90,padding:"0 2px"}}>
      {data.map((d,i)=>{
        const cc = getCentroColor(d.label);
        return (
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,fontWeight:800,color:cc.dot,fontFamily:"'DM Mono',monospace"}}>{d.value||""}</span>
            <div style={{width:"100%",borderRadius:"5px 5px 0 0",height:`${(d.value/max)*65}px`,
              minHeight:d.value?6:0,background:cc.dot,transition:"height .4s",opacity:.85}}/>
            <span style={{fontSize:9,color:"#444",textAlign:"center",lineHeight:1.2}}>{d.label.split(" ")[0]}</span>
          </div>
        );
      })}
    </div>
  );
}

function AnnualChart({ allRegistros, settings, activeKey }) {
  const currentYear = today.getFullYear();
  const [chartYear, setChartYear] = useState(currentYear);

  const monthlyData = useMemo(()=>{
    return MONTHS.map((name, mi)=>{
      const key = `${chartYear}-${String(mi+1).padStart(2,"0")}`;
      const regs = allRegistros.filter(r=>r.date&&r.date.startsWith(key));
      let lv=0, sab=0;
      regs.forEach(r=>{
        const t = tarifaDia(r.date, settings);
        if(t.esSabado) sab+=r.horas; else lv+=r.horas;
      });
      const bruto = lv*settings.valorLV + sab*settings.valorSab;
      const isActive = key===activeKey;
      const isFuture = key > activeKey;
      return { name, key, bruto, lv, sab, isActive, isFuture, hasData: regs.length>0 };
    });
  }, [allRegistros, chartYear, settings, activeKey]);

  const maxBruto = Math.max(...monthlyData.map(d=>d.bruto), 1);
  const totalAnual = monthlyData.reduce((s,d)=>s+d.bruto, 0);
  const mesesConDatos = monthlyData.filter(d=>d.hasData).length;
  const promedio = mesesConDatos>0 ? Math.round(totalAnual/mesesConDatos) : 0;

  const [hoveredIdx, setHoveredIdx] = useState(null);

  return (
    <div className="card" style={{padding:0,overflow:"hidden"}}>
      <div style={{padding:"16px 18px 0"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <div style={{fontWeight:800,fontSize:13,color:"#e8e4dc"}}>📈 Ingresos anuales</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button onClick={()=>setChartYear(y=>y-1)}
              style={{background:"#1e1e26",border:"1px solid #2a2a35",color:"#555",fontSize:14,cursor:"pointer",
                borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <span style={{fontSize:13,fontWeight:800,color:"#e8c84a",fontFamily:"'DM Mono',monospace",minWidth:36,textAlign:"center"}}>{chartYear}</span>
            <button onClick={()=>setChartYear(y=>y+1)} disabled={chartYear>=currentYear}
              style={{background:"#1e1e26",border:"1px solid #2a2a35",
                color:chartYear>=currentYear?"#2a2a35":"#555",fontSize:14,
                cursor:chartYear>=currentYear?"default":"pointer",
                borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:16,marginTop:10}}>
          <div style={{flex:1,background:"#0f0f13",borderRadius:10,padding:"10px 12px",border:"1px solid #1e1e26"}}>
            <div style={{fontSize:8,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:.5,marginBottom:2}}>TOTAL AÑO</div>
            <div style={{fontSize:15,fontWeight:800,color:"#e8c84a",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(totalAnual)}</div>
          </div>
          <div style={{flex:1,background:"#0f0f13",borderRadius:10,padding:"10px 12px",border:"1px solid #1e1e26"}}>
            <div style={{fontSize:8,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:.5,marginBottom:2}}>PROM. MES</div>
            <div style={{fontSize:15,fontWeight:800,color:"#6fcf6f",fontFamily:"'DM Mono',monospace"}}>{mesesConDatos>0?fmtCLP(promedio):"—"}</div>
          </div>
        </div>
      </div>

      <div style={{padding:"0 14px 6px",position:"relative"}}>
        {promedio>0&&(
          <div style={{position:"absolute",left:14,right:14,
            top:`${(1-(promedio/maxBruto))*110+8}px`,
            borderTop:"1px dashed #e8c84a33",zIndex:1,pointerEvents:"none"}}>
          </div>
        )}
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:118,paddingTop:8}}>
          {monthlyData.map((d,i)=>{
            const pct = d.bruto>0 ? (d.bruto/maxBruto) : 0;
            const barH = Math.max(pct*100, d.hasData?4:0);
            const isHov = hoveredIdx===i;
            const color = d.isActive ? "#e8c84a" : d.isFuture ? "#1e1e26" : d.hasData ? "#7c7cdf" : "#1a1a22";
            const borderC = d.isActive ? "#e8c84a" : d.isFuture ? "#2a2a35" : d.hasData ? "#5c6bc0" : "transparent";
            return (
              <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:d.hasData?"pointer":"default",position:"relative"}}
                onMouseEnter={()=>d.hasData&&setHoveredIdx(i)}
                onMouseLeave={()=>setHoveredIdx(null)}
                onTouchStart={()=>d.hasData&&setHoveredIdx(i===hoveredIdx?null:i)}>
                {isHov&&(
                  <div style={{position:"absolute",bottom:"100%",left:"50%",transform:"translateX(-50%)",
                    background:"#18181f",border:"1px solid #3a3a4a",borderRadius:10,padding:"8px 12px",
                    zIndex:10,whiteSpace:"nowrap",pointerEvents:"none",minWidth:130,
                    marginBottom:6,boxShadow:"0 4px 20px #0009"}}>
                    <div style={{fontSize:11,fontWeight:800,color:"#e8e4dc",marginBottom:3}}>{d.name} {chartYear}</div>
                    <div style={{fontSize:13,fontWeight:800,color:"#e8c84a",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(d.bruto)}</div>
                    <div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace",marginTop:2}}>
                      {d.lv}h L–V · {d.sab}h Sáb

                  </div>
                )}
                <div style={{width:"100%",borderRadius:"4px 4px 0 0",
                  height:`${barH}px`,
                  background: isHov ? (d.isActive?"#f0d060":"#9999ef") : color,
                  border:`1px solid ${borderC}`,
                  transition:"height .4s, background .15s",
                  opacity: d.isFuture ? 0.3 : 1,
                  position:"relative"}}/>
                <span style={{fontSize:8,color:d.isActive?"#e8c84a":d.hasData?"#555":"#2a2a35",
                  fontFamily:"'DM Mono',monospace",textAlign:"center",lineHeight:1.1,fontWeight:d.isActive?800:400}}>
                  {d.name.slice(0,3)}
                </span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{display:"flex",gap:12,padding:"10px 18px 16px",borderTop:"1px solid #1e1e26",flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <div style={{width:10,height:10,borderRadius:3,background:"#e8c84a"}}/>
          <span style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>Mes actual</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <div style={{width:10,height:10,borderRadius:3,background:"#7c7cdf"}}/>
          <span style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>Meses anteriores</span>
        </div>
        {promedio>0&&(
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:10,height:2,background:"#e8c84a55",borderTop:"1px dashed #e8c84a55"}}/>
            <span style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>Promedio</span>
          </div>
        )}
      </div>

      {monthlyData.some(d=>d.hasData)&&(
        <div style={{borderTop:"1px solid #1e1e26"}}>
          {monthlyData.filter(d=>d.hasData).reverse().map((d,i)=>(
            <div key={d.key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",
              padding:"9px 18px",borderTop:i>0?"1px solid #1a1a22":"none",
              background:d.isActive?"#1a1800":"transparent"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:d.isActive?"#e8c84a":"#5c6bc0",flexShrink:0}}/>
                <span style={{fontSize:12,fontWeight:d.isActive?800:500,
                  color:d.isActive?"#e8e4dc":"#666"}}>{d.name}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:10,color:"#333",fontFamily:"'DM Mono',monospace"}}>{d.lv+d.sab}h</span>
                <span style={{fontSize:13,fontWeight:800,color:d.isActive?"#e8c84a":"#888",
                  fontFamily:"'DM Mono',monospace"}}>{fmtCLP(d.bruto)}</span>

            </div>
          ))}

      )}

      {!monthlyData.some(d=>d.hasData)&&(
        <div style={{textAlign:"center",color:"#2a2a35",fontSize:13,padding:"20px 0 24px",fontFamily:"'DM Mono',monospace"}}>
          Sin registros en {chartYear}
        </div>
      )}
    </div>
  );
}

function SettingsModal({ settings, onSave, onClose }) {
  const [lv, setLv]           = useState(String(settings.valorLV));
  const [sab, setSab]         = useState(String(settings.valorSab));
  const [boleta, setBoleta]   = useState(!!settings.boleta);
  const [factor, setFactor]   = useState(String(settings.factor||DEFAULT_FACTOR));
  const [centros, setCentros] = useState(settings.centros||[]);
  const [newCentro, setNewCentro] = useState("");

  const cleanInt = v => parseInt(String(v).replace(/\D/g,""),10) || 0;
  const lvNum  = cleanInt(lv);
  const sabNum = cleanInt(sab);

  function addCentro() {
    const nombre = newCentro.trim();
    if(!nombre || centros.includes(nombre)) return;
    setCentros(prev=>[...prev, nombre]);
    setNewCentro("");
  }
  function removeCentro(c) {
    if(centros.length<=1) return;
    setCentros(prev=>prev.filter(x=>x!==c));
  }
  function handleSave() {
    const newF = parseFloat(factor);
    if(!lvNum || !sabNum || centros.length===0) return;
    if(boleta && (isNaN(newF) || newF<=0)) return;
    const factorGuardado = isNaN(newF) ? DEFAULT_FACTOR : newF;
    onSave({...settings, valorLV:lvNum, valorSab:sabNum, boleta, factor:factorGuardado, centros});
    onClose();
  }

  const inp = {width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #2a2a35",
    background:"#0f0f13",fontSize:14,color:"#e8e4dc",outline:"none",fontFamily:"'DM Mono',monospace"};
  const lbl = {fontSize:10,fontWeight:700,color:"#555",letterSpacing:.5,textTransform:"uppercase",marginBottom:6,display:"block"};

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="sheet-modal" style={{width:"100%",maxWidth:480,background:"#18181f",borderRadius:"22px 22px 0 0",
        border:"1px solid #2a2a35",padding:24,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:"#2a2a35",borderRadius:100,margin:"0 auto 18px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div style={{fontWeight:800,fontSize:17,color:"#e8e4dc"}}>⚙️ Configuración</div>
          <button onClick={onClose} style={{background:"#1e1e26",border:"1px solid #2a2a35",color:"#555",
            fontSize:18,cursor:"pointer",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"#e8c84a",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Tarifas por hora</div>
        <div style={{display:"flex",gap:10,marginBottom:18}}>
          <div style={{flex:1}}>
            <label style={lbl}>Lun–Vie ($)</label>
            <input style={inp} value={lv} onChange={e=>setLv(e.target.value)} inputMode="numeric"/>
          </div>
          <div style={{flex:1}}>
            <label style={lbl}>Sábado ($)</label>
            <input style={inp} value={sab} onChange={e=>setSab(e.target.value)} inputMode="numeric"/>
          </div>
        </div>
        <div style={{background:"#0f0f13",borderRadius:10,padding:"10px 14px",marginBottom:22,border:"1px solid #2a2a35"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,fontFamily:"'DM Mono',monospace"}}>
            <span style={{color:"#666"}}>3h L–V → <b style={{color:"#6fcf6f"}}>{fmtCLP(lvNum*3)}</b></span>
            <span style={{color:"#666"}}>4h Sáb → <b style={{color:"#ef7070"}}>{fmtCLP(sabNum*4)}</b></span>
          </div>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"#e8c84a",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Tipo de pago</div>
        <button onClick={()=>setBoleta(b=>!b)} style={{
          width:"100%",padding:"13px 16px",borderRadius:12,cursor:"pointer",marginBottom:boleta?12:22,
          border:boleta?"2px solid #e8c84a":"1.5px solid #2a2a35",
          background:boleta?"#1a1800":"#0f0f13",
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{textAlign:"left"}}>
            <div style={{fontWeight:800,fontSize:13,color:boleta?"#e8c84a":"#555"}}>🧾 Boleta de honorarios</div>
            <div style={{fontSize:11,color:"#444",marginTop:2}}>Aplica descuento por retención de impuesto</div>
          </div>
          <div style={{width:22,height:22,borderRadius:6,border:boleta?"2px solid #e8c84a":"2px solid #333",
            background:boleta?"#e8c84a":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {boleta&&<span style={{color:"#0f0f13",fontSize:14,fontWeight:900}}>✓</span>}
          </div>
        </button>
        {boleta&&(
          <div style={{marginBottom:22,padding:"14px 16px",background:"#0f0f13",borderRadius:12,border:"1px solid #2a2a35"}}>
            <label style={lbl}>Factor de descuento</label>
            <input style={inp} value={factor} onChange={e=>setFactor(e.target.value)} placeholder="0.825" inputMode="decimal"/>
            <div style={{fontSize:11,color:"#444",marginTop:6}}>Ej: 0.825 = retención del 17.5%</div>
          </div>
        )}
        <div style={{fontSize:11,fontWeight:700,color:"#e8c84a",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Centros de salud</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
          {centros.map(c=>{
            const cc=getCentroColor(c);
            return (
              <div key={c} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                borderRadius:10,background:cc.bg,border:`1.5px solid ${cc.border}`}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:cc.dot,flexShrink:0}}/>
                <span style={{flex:1,fontWeight:700,fontSize:13,color:cc.text}}>{c}</span>
                <button onClick={()=>removeCentro(c)} disabled={centros.length<=1}
                  style={{background:"none",border:"none",color:centros.length<=1?"#2a2a35":"#555",
                    fontSize:18,cursor:centros.length<=1?"default":"pointer",padding:"0 4px",lineHeight:1}}>✕</button>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:26}}>
          <input style={{...inp,flex:1,padding:"10px 14px"}} value={newCentro}
            onChange={e=>setNewCentro(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addCentro()}
            placeholder="Nuevo centro…"/>
          <button onClick={addCentro} style={{padding:"10px 16px",borderRadius:10,border:"1px solid #2d5a2d",
            background:"#1a3a1a",color:"#6fcf6f",fontWeight:800,fontSize:18,cursor:"pointer"}}>+</button>
        </div>
        <button onClick={handleSave} style={{width:"100%",padding:"14px 0",borderRadius:12,border:"none",
          background:"linear-gradient(90deg,#e8c84a,#c8a830)",color:"#0f0f13",fontWeight:800,fontSize:15,cursor:"pointer"}}>
          Guardar cambios
        </button>
      </div>
    </div>
  );
}

function Splash({ onEnter }) {
  const [gone, setGone] = useState(false);
  function enter() {
    setGone(true);
    setTimeout(onEnter, 480);
  }
  const diaAnio = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0))/86400000);
  const frase = FRASES[diaAnio % FRASES.length];
  return (
    <div className={`splash${gone?" gone":""}`}>
      <div style={{fontSize:"3.5rem",marginBottom:4}}>🐱</div>
      <div style={{fontSize:"1.9rem",fontWeight:800,color:"#e8e4dc",letterSpacing:-.5}}>Finanzas Médicas</div>
      <div style={{fontSize:"0.88rem",color:"#555",textAlign:"center",lineHeight:1.7,maxWidth:260,marginTop:4}}>{frase}</div>
      <div style={{marginTop:4,fontSize:"0.68rem",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",
        background:"rgba(232,200,74,0.08)",border:"1px solid rgba(232,200,74,0.2)",color:"#e8c84a",
        padding:"4px 14px",borderRadius:100,fontFamily:"'DM Mono',monospace"}}>
        Loki & Kurochan ✨
      </div>
      <button onClick={enter} style={{marginTop:22,background:"#e8c84a",color:"#0f0f13",border:"none",
        borderRadius:100,padding:"13px 36px",fontSize:"0.92rem",fontWeight:800,cursor:"pointer",
        fontFamily:"'Syne',sans-serif",boxShadow:"0 4px 24px rgba(232,200,74,0.25)"}}>
        Entrar a la app
      </button>

  );
}

function App() {
  const defaultSettings = { valorLV:DEFAULT_VALOR_LV, valorSab:DEFAULT_VALOR_SAB, factor:DEFAULT_FACTOR, boleta:false, centros:DEFAULT_CENTROS };
  const [splashDone, setSplashDone] = useState(false);
  const [tab, setTab]           = useState("ingreso");
  const [calYear, setCalYear]   = useState(today.getFullYear());
  const [calMonth, setCalMonth] = useState(today.getMonth());
  const [selDate, setSelDate]   = useState("");
  const [centro, setCentro]     = useState(DEFAULT_CENTROS[0]);
  const [editId, setEditId]     = useState(null);
  const [toast, setToast]       = useState(null);
  const [allRegistros, setAllRegistros] = useState([]);
  const [settings, setSettings] = useState(defaultSettings);
  const [histTab, setHistTab]   = useState(null);
  const [listaKey, setListaKey] = useState(monthKey(today.getFullYear(), today.getMonth()));
  const [showSettings, setShowSettings] = useState(false);
  const [saveStatus, setSaveStatus]     = useState("sync");
  const [confirm, setConfirm]   = useState(null);

  const activeKey = monthKey(today.getFullYear(), today.getMonth());

  useEffect(()=>{
    async function load() {
      setSaveStatus("sync");
      try {
        const data = await apiGet();
        if(data.ok) {
          const rawRegs = data.registros||[];
          const regs = rawRegs.map(fromSheetRow).filter(r=>r.date);
          setAllRegistros(regs);
          if(data.settings) setSettings(parseSettings(data.settings));
          setSaveStatus("saved");
        } else { setSaveStatus("error"); }
      } catch(e) { setSaveStatus("error"); }
    }
    load();
  }, []);

  const registros = useMemo(()=>
    allRegistros.filter(r=>r.date&&r.date.startsWith(activeKey))
      .sort((a,b)=>a.date.localeCompare(b.date)),
  [allRegistros, activeKey]);

  const marked = useMemo(()=>{
    const calKey = monthKey(calYear, calMonth);
    const m = new Map();
    allRegistros
      .filter(r=>r.date&&r.date.startsWith(calKey))
      .forEach(r=>m.set(r.date, r));
    return m;
  }, [allRegistros, calYear, calMonth]);

  const historyMonths = useMemo(()=>{
    const keys = new Set(allRegistros.map(r=>r.date.slice(0,7)));
    return [...keys].filter(k=>k!==activeKey).sort().reverse();
  }, [allRegistros, activeKey]);

  const listaMonths = useMemo(()=>{
    const keys = new Set(allRegistros.map(r=>r.date.slice(0,7)));
    keys.add(activeKey);
    return [...keys].sort().reverse();
  }, [allRegistros, activeKey]);

  const listaRegistros = useMemo(()=>
    allRegistros.filter(r=>r.date&&r.date.startsWith(listaKey))
      .sort((a,b)=>a.date.localeCompare(b.date)),
  [allRegistros, listaKey]);

  const tarifaSel = useMemo(()=>tarifaDia(selDate, settings),[selDate, settings]);
  const horas = tarifaSel.horas;
  const dia   = useMemo(()=>getDia(selDate),[selDate]);
  const esSab = tarifaSel.esSabado;

  function toast_(msg,type="ok"){setToast({msg,type});setTimeout(()=>setToast(null),2500);}

  function pedirConfirm(msg, cb) {
    setConfirm({ msg, onConfirm: ()=>{ setConfirm(null); cb(); } });
  }

  async function guardar() {
    if(!selDate) return toast_("Elige una fecha primero","err");
    if(dow(selDate)===0) return toast_("No hay horas los domingos","err");
    if(esFeriado(selDate)) return toast_("Día feriado — no se registra","err");
    const yaExiste = allRegistros.find(r=>r.date===selDate && r.id!==editId);
    if(yaExiste) return toast_("Fecha ya registrada","err");

    const id = editId || genId();
    const reg = { id, date:selDate, dia, centro, horas };
    const mk = selDate.slice(0,7);

    setAllRegistros(prev=>{
      const filtered = prev.filter(r=>r.id!==id);
      return [...filtered, reg].sort((a,b)=>a.date.localeCompare(b.date));
    });
    setEditId(null);
    setSelDate("");
    toast_("Guardado ✓");
    setSaveStatus("saving");

    try {
      const res = await apiPost({ action:"saveRegistro", registro: toSheetRow(reg, mk, settings) });
      setSaveStatus(res && res.ok===false ? "error" : "saved");
    } catch(e) { setSaveStatus("error"); }
  }

  function editar(reg) {
    setSelDate(reg.date); setCentro(reg.centro); setEditId(reg.id); setTab("ingreso");
    const d=new Date(reg.date+"T12:00:00"); setCalYear(d.getFullYear()); setCalMonth(d.getMonth());
  }

  async function eliminar(reg) {
    pedirConfirm("¿Eliminar este registro? No se puede deshacer.", async ()=>{
      setAllRegistros(prev=>prev.filter(r=>r.id!==reg.id));
      if(editId===reg.id){ setEditId(null); setSelDate(""); }
      toast_("Eliminado");
      setSaveStatus("saving");
      try {
        const res = await apiPost({ action:"deleteRegistro", id: reg.id });
        setSaveStatus(res && res.ok===false ? "error" : "saved");
      } catch(e) { setSaveStatus("error"); }
    });
  }

  function handleExport(regs,year,month) {
    try { exportToExcel(regs,year,month,settings); toast_("Excel descargado ✓"); }
    catch { toast_("Error al exportar","err"); }
  }

  async function deleteMonth(key) {
    const [y,m]=key.split("-").map(Number);
    pedirConfirm(`¿Eliminar todos los registros de ${MONTHS[m-1]} ${y}?`, async ()=>{
      const toDelete = allRegistros.filter(r=>r.date.startsWith(key));
      setAllRegistros(prev=>prev.filter(r=>!r.date.startsWith(key)));
      if(histTab===key) setHistTab(null);
      if(listaKey===key && key!==activeKey) setListaKey(activeKey);
      toast_("Mes eliminado");
      setSaveStatus("saving");
      let huboError = false;
      for(const r of toDelete) {
        try {
          const res = await apiPost({ action:"deleteRegistro", id: r.id });
          if(res && res.ok===false) huboError = true;
        } catch(e) { huboError = true; }
      }
      setSaveStatus(huboError ? "error" : "saved");
      if(huboError) toast_("Algunos registros no se borraron en la nube","err");
    });
  }

  async function handleSaveSettings(s) {
    setSettings(s);
    toast_("Configuración guardada ✓");
    setSaveStatus("saving");
    try {
      const res = await apiPost({ action:"saveSettings", settings:{
        valorLV:s.valorLV, valorSab:s.valorSab, factor:s.factor, boleta:s.boleta,
        centros:JSON.stringify(s.centros),
      }});
      setSaveStatus(res && res.ok===false ? "error" : "saved");
    } catch(e) { setSaveStatus("error"); }
  }

  function calcStats(regs) {
    const por={};
    settings.centros.forEach(c=>{por[c]={lv:0,sab:0};});
    regs.forEach(r=>{
      const t = tarifaDia(r.date, settings);
      if(!por[r.centro]) por[r.centro]={lv:0,sab:0};
      if(t.esSabado) por[r.centro].sab+=r.horas; else por[r.centro].lv+=r.horas;
    });
    let lv=0,sab=0;
    Object.values(por).forEach(v=>{lv+=v.lv;sab+=v.sab;});
    const bruto=lv*settings.valorLV+sab*settings.valorSab;
    const factor=settings.boleta?(settings.factor||DEFAULT_FACTOR):1;
    return{por,lv,sab,vLV:lv*settings.valorLV,vSab:sab*settings.valorSab,bruto,neto:Math.round(bruto*factor)};
  }

  const stats   = useMemo(()=>calcStats(registros),[registros,settings]);
  const barData = useMemo(()=>settings.centros.map(c=>({label:c,value:(stats.por[c]?.lv||0)+(stats.por[c]?.sab||0)})).filter(d=>d.value>0),[stats,settings.centros]);

  const lbl  = {fontSize:10,fontWeight:700,color:"#555",letterSpacing:.5,textTransform:"uppercase",marginBottom:6,display:"block"};
  const btnP = on=>({width:"100%",padding:"14px 0",borderRadius:12,border:"none",
    background:on?"linear-gradient(90deg,#e8c84a,#c8a830)":"#1a1a22",
    color:on?"#0f0f13":"#333",fontWeight:800,fontSize:15,cursor:on?"pointer":"not-allowed"});

  if(!splashDone) return <Splash onEnter={()=>setSplashDone(true)}/>;

  return (
    <div style={{minHeight:"100vh",background:"#0f0f13",paddingBottom:70}}>
      <div style={{background:"#18181f",borderBottom:"1px solid #2a2a35",
        padding:"env(safe-area-inset-top,14px) 18px 0",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12,paddingTop:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:17,color:"#e8e4dc",letterSpacing:-.3}}>Finanzas Médicas</div>
            <div style={{fontSize:11,color:"#444",marginTop:1,fontFamily:"'DM Mono',monospace"}}>
              {MONTHS[today.getMonth()]} {today.getFullYear()} · <span style={{color:saveStatus==="error"?"#ef5350":saveStatus==="saving"?"#e8c84a":saveStatus==="sync"?"#888":"#4caf50"}}>
              {saveStatus==="error"?"⚠ sin conexión":saveStatus==="saving"?"☁️ guardando…":saveStatus==="sync"?"⏳ cargando…":"✓ sincronizado"}</span>
            </div>
          </div>
          <div style={{textAlign:"right",marginRight:4}}>
            <div style={{fontSize:26,fontWeight:800,color:"#e8c84a",lineHeight:1,fontFamily:"'DM Mono',monospace"}}>
              {stats.lv+stats.sab}<span style={{fontSize:13,fontWeight:400,color:"#555"}}>h</span>
            </div>
            <div style={{fontSize:11,color:"#444",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(stats.bruto)}</div>
          </div>
          <button onClick={()=>setShowSettings(true)} style={{background:"#1e1e26",border:"1px solid #2a2a35",
            borderRadius:10,padding:"8px 10px",cursor:"pointer",fontSize:16}}>⚙️</button>
        </div>
        <div style={{display:"flex",marginTop:12}}>
          {[["ingreso","📅 Ingresar"],["lista","📋 Lista"],["resumen","📊 Resumen"],["historial","🗂 Historial"]].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"10px 2px",border:"none",
              background:"transparent",cursor:"pointer",fontSize:11,fontWeight:700,
              color:tab===t?"#e8c84a":"#444",borderBottom:tab===t?"2px solid #e8c84a":"2px solid transparent",
              transition:"all .15s"}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"16px 14px 0",maxWidth:520,margin:"0 auto"}}>

        {tab==="ingreso"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div className="card">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                <button onClick={()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);}}
                  style={{background:"none",border:"none",fontSize:22,color:"#555",cursor:"pointer",padding:"0 6px"}}>‹</button>
                <span style={{fontWeight:800,fontSize:14,color:"#e8e4dc"}}>{MONTHS[calMonth]} {calYear}</span>
                <button onClick={()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);}}
                  style={{background:"none",border:"none",fontSize:22,color:"#555",cursor:"pointer",padding:"0 6px"}}>›</button>
              </div>
              <Calendar year={calYear} month={calMonth} marked={marked} selected={selDate} onSelect={s=>{
                const reg = marked.get(s);
                if(reg && editId===null) { editar(reg); }
                else { setSelDate(s); }
              }}/>
              {selDate&&(
                <div style={{marginTop:14,padding:"10px 14px",background:"#0f0f13",borderRadius:10,
                  borderLeft:`3px solid ${esSab?"#ef5350":"#e8c84a"}`}}>
                  <div style={{fontSize:13,fontWeight:700,color:esSab?"#ef5350":"#e8c84a",fontFamily:"'DM Mono',monospace"}}>
                    {dia.charAt(0).toUpperCase()+dia.slice(1)} · {selDate.split("-").reverse().join("/")}
                  </div>
                  <div style={{fontSize:12,color:"#444",marginTop:2}}>
                    {horas===0?"⛔ Domingo — no se registra":`⏱ ${horas}h · ${esSab?"Sáb":"L–V"} ${fmtCLP(tarifaSel.total)}`}
                  </div>
                </div>
              )}
            </div>
            <div className="card">
              <div style={{fontWeight:800,fontSize:14,color:"#e8e4dc",marginBottom:16}}>
                {editId!==null?"✏️ Editar registro":"➕ Nuevo registro"}
              </div>
              <div style={{marginBottom:16}}>
                <label style={lbl}>Centro de salud</label>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {settings.centros.map(c=>{
                    const cc=getCentroColor(c); const sel=centro===c;
                    return (
                      <button key={c} onClick={()=>setCentro(c)} style={{
                        padding:"11px 14px",borderRadius:10,cursor:"pointer",
                        border:sel?`2px solid ${cc.dot}`:"1.5px solid #2a2a35",
                        background:sel?cc.bg:"#0f0f13",color:sel?cc.text:"#444",
                        fontWeight:sel?800:500,fontSize:13,textAlign:"left",
                        display:"flex",alignItems:"center",gap:10,transition:"all .12s"}}>
                        <span style={{width:8,height:8,borderRadius:"50%",background:sel?cc.dot:"#2a2a35",flexShrink:0}}/>
                        {c}
                      </button>
                    );
                  })}
                </div>
              </div>
              {selDate&&horas>0&&(
                <div style={{display:"flex",gap:8,marginBottom:16}}>
                  {[3,4].map(h=>(
                    <div key={h} style={{flex:1,padding:"12px 0",borderRadius:10,textAlign:"center",
                      border:`2px solid ${horas===h?"#e8c84a":"#2a2a35"}`,
                      background:horas===h?"#1a1800":"#0f0f13",
                      color:horas===h?"#e8c84a":"#333",fontWeight:800,fontSize:20,fontFamily:"'DM Mono',monospace"}}>
                      {h}h
                      <div style={{fontSize:9,fontWeight:600,opacity:.6,marginTop:2}}>{h===3?"LUN–JUE":"VIE–SÁB"}</div>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={guardar} disabled={!selDate||horas===0} style={btnP(selDate&&horas>0)}>
                {editId!==null?"💾 Guardar cambios":"✅ Agregar registro"}
              </button>
              {editId!==null&&(
                <button onClick={()=>{setEditId(null);setSelDate("");}} style={{width:"100%",marginTop:10,padding:"11px 0",
                  borderRadius:12,border:"1.5px solid #2a2a35",background:"#0f0f13",
                  color:"#555",fontWeight:700,fontSize:14,cursor:"pointer"}}>Cancelar</button>
              )}
            </div>
          </div>
        )}

        {tab==="lista"&&(()=> {
          const [ly,lm] = listaKey.split("-").map(Number);
          const idxActual = listaMonths.indexOf(listaKey);
          const lStats = calcStats(listaRegistros);
          const esMesActual = listaKey===activeKey;
          return (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div className="card" style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:8}}>
              <button onClick={()=>{ if(idxActual<listaMonths.length-1) setListaKey(listaMonths[idxActual+1]); }}
                disabled={idxActual>=listaMonths.length-1}
                style={{background:"#1e1e26",border:"1px solid #2a2a35",borderRadius:8,width:32,height:32,
                  color:idxActual>=listaMonths.length-1?"#2a2a35":"#888",fontSize:16,
                  cursor:idxActual>=listaMonths.length-1?"default":"pointer",flexShrink:0}}>‹</button>
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontWeight:800,fontSize:14,color:"#e8e4dc"}}>{MONTHS[lm-1]} {ly}</div>
                <div style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace",marginTop:1}}>
                  {esMesActual?"mes actual · ":""}{listaRegistros.length} días · {lStats.lv+lStats.sab}h
                </div>
              </div>
              <button onClick={()=>{ if(idxActual>0) setListaKey(listaMonths[idxActual-1]); }}
                disabled={idxActual<=0}
                style={{background:"#1e1e26",border:"1px solid #2a2a35",borderRadius:8,width:32,height:32,
                  color:idxActual<=0?"#2a2a35":"#888",fontSize:16,
                  cursor:idxActual<=0?"default":"pointer",flexShrink:0}}>›</button>
            </div>

            {listaRegistros.length>0&&(
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>handleExport(listaRegistros,ly,lm-1)}
                  style={{flex:1,padding:"13px 0",borderRadius:12,border:"1px solid #2d5a2d",
                    background:"#1a3a1a",color:"#6fcf6f",fontWeight:800,fontSize:14,cursor:"pointer"}}>
                  📥 Exportar Excel
                </button>
                <button onClick={()=>deleteMonth(listaKey)}
                  style={{padding:"13px 18px",borderRadius:12,border:"1px solid #3a1a1a",
                    background:"#1a0a0a",color:"#ef5350",fontWeight:800,fontSize:14,cursor:"pointer"}}>
                  🗑 Borrar mes
                </button>
              </div>
            )}

            <div className="card" style={{padding:0,overflow:"hidden"}}>
              <div style={{padding:"14px 18px",borderBottom:"1px solid #2a2a35",
                display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:800,fontSize:14,color:"#e8e4dc"}}>{MONTHS[lm-1]} {ly}</span>
                <span style={{background:"#1e1e26",color:"#555",border:"1px solid #2a2a35",
                  borderRadius:20,padding:"3px 12px",fontSize:11,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>
                  {listaRegistros.length} días
                </span>
              </div>
              {listaRegistros.length===0&&(
                <div style={{padding:40,textAlign:"center",color:"#2a2a35",fontSize:14}}>
                  Sin registros este mes.<br/><span style={{fontSize:12}}>{esMesActual?"Agrega días en 📅":"Otro mes puede tener datos"}</span>
                </div>
              )}
              {listaRegistros.map((r,i)=>{
                const t=tarifaDia(r.date, settings); const s=t.esSabado; const cc=getCentroColor(r.centro);
                return (
                  <div key={r.id||i} style={{display:"flex",alignItems:"center",padding:"12px 16px",
                    borderBottom:"1px solid #1e1e26",background:i%2===0?"#18181f":"#1b1b22"}}>
                    <div style={{width:42,height:42,borderRadius:10,marginRight:12,flexShrink:0,
                      background:"#0f0f13",border:`1px solid ${s?"#3a1a1a":"#1a1a3a"}`,
                      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                      <div style={{fontSize:15,fontWeight:800,color:s?"#ef5350":"#5c6bc0",
                        lineHeight:1,fontFamily:"'DM Mono',monospace"}}>{r.date.split("-")[2]}</div>
                      <div style={{fontSize:8,fontWeight:700,color:"#444"}}>{r.dia.slice(0,3).toUpperCase()}</div>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:12,color:cc.text,
                        whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.centro}</div>
                      <div style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(r.horas*t.valorHora)}</div>
                    </div>
                    <div style={{background:"#0f0f13",color:s?"#ef5350":"#7c7cdf",
                      borderRadius:8,padding:"4px 10px",fontWeight:800,fontSize:14,
                      marginRight:8,fontFamily:"'DM Mono',monospace"}}>{r.horas}h</div>
                    <button onClick={()=>editar(r)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer",padding:"4px",opacity:.5}}>✏️</button>
                    <button onClick={()=>eliminar(r)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer",padding:"4px",opacity:.5}}>🗑️</button>
                  </div>
                );
              })}
            </div>
          </div>
          );
        })()}

        {tab==="resumen"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {registros.length>0&&(
              <button onClick={()=>handleExport(registros,today.getFullYear(),today.getMonth())}
                style={{width:"100%",padding:"13px 0",borderRadius:12,border:"1px solid #2d5a2d",
                  background:"#1a3a1a",color:"#6fcf6f",fontWeight:800,fontSize:14,cursor:"pointer"}}>
                📥 Exportar a Excel
              </button>
            )}
            <div className="card" style={{position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",top:-40,right:-40,width:140,height:140,borderRadius:"50%",
                background:"radial-gradient(circle,#e8c84a0a,transparent 70%)"}}/>
              <div style={{fontSize:10,fontWeight:700,color:"#444",letterSpacing:1,textTransform:"uppercase",
                marginBottom:6,fontFamily:"'DM Mono',monospace"}}>
                {MONTHS[today.getMonth()]} {today.getFullYear()}
              </div>
              <div style={{fontSize:52,fontWeight:800,color:"#e8c84a",lineHeight:1,fontFamily:"'DM Mono',monospace"}}>
                {stats.lv+stats.sab}<span style={{fontSize:22,fontWeight:400,color:"#333"}}>h</span>
              </div>
              <div style={{display:"flex",gap:10,marginTop:16}}>
                <div style={{flex:1,background:"#0f0f13",borderRadius:12,padding:"12px 14px",border:"1px solid #1a1a2a"}}>
                  <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>LUN–VIE</div>
                  <div style={{fontSize:20,fontWeight:800,color:"#7c7cdf",fontFamily:"'DM Mono',monospace"}}>{stats.lv}h</div>
                  <div style={{fontSize:11,color:"#333",fontFamily:"'DM Mono',monospace",marginTop:2}}>{fmtCLP(stats.vLV)}</div>
                </div>
                <div style={{flex:1,background:"#0f0f13",borderRadius:12,padding:"12px 14px",border:"1px solid #2a1a1a"}}>
                  <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>SÁBADOS</div>
                  <div style={{fontSize:20,fontWeight:800,color:"#ef5350",fontFamily:"'DM Mono',monospace"}}>{stats.sab}h</div>
                  <div style={{fontSize:11,color:"#333",fontFamily:"'DM Mono',monospace",marginTop:2}}>{fmtCLP(stats.vSab)}</div>
                </div>
              </div>
              <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #2a2a35"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:settings.boleta?8:0}}>
                  <span style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace",fontWeight:700,letterSpacing:.5}}>BRUTO</span>
                  <span style={{fontSize:22,fontWeight:800,color:"#e8e4dc",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(stats.bruto)}</span>
                </div>
                {settings.boleta&&(
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                    <span style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace",fontWeight:700,letterSpacing:.5}}>
                      NETO <span style={{color:"#333"}}>×{settings.factor}</span>
                    </span>
                    <span style={{fontSize:22,fontWeight:800,color:"#6fcf6f",fontFamily:"'DM Mono',monospace"}}>{fmtCLP(stats.neto)}</span>
                  </div>
                )}
              </div>
            </div>
            {barData.length>0&&(
              <div className="card">
                <div style={{fontWeight:800,fontSize:13,color:"#e8e4dc",marginBottom:14}}>Horas por centro</div>
                <BarChart data={barData}/>
                <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
                  {settings.centros.map(c=>{
                    const lv=stats.por[c]?.lv||0,s=stats.por[c]?.sab||0,tot=lv+s;
                    if(!tot) return null;
                    const mx=Math.max(...settings.centros.map(x=>(stats.por[x]?.lv||0)+(stats.por[x]?.sab||0)),1);
                    const cc=getCentroColor(c);
                    return (
                      <div key={c}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5}}>
                          <span style={{fontWeight:700,color:cc.text}}>{c}</span>
                          <span style={{color:"#444",fontFamily:"'DM Mono',monospace",fontSize:11}}>
                            {tot}h · {fmtCLP(lv*settings.valorLV+s*settings.valorSab)}
                          </span>
                        </div>
                        <div style={{height:6,borderRadius:4,background:"#1e1e26",overflow:"hidden"}}>
                          <div style={{height:"100%",borderRadius:4,width:`${(tot/mx)*100}%`,
                            background:cc.dot,transition:"width .5s"}}/>
                        </div>
                        <div style={{fontSize:10,color:"#333",marginTop:3,fontFamily:"'DM Mono',monospace"}}>
                          {lv>0&&`${lv}h L–V`}{lv>0&&s>0&&" · "}{s>0&&`${s}h Sáb`}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {(stats.lv+stats.sab)===0&&(
              <div style={{textAlign:"center",color:"#2a2a35",fontSize:14,padding:30}}>Sin registros este mes</div>
            )}
            <AnnualChart allRegistros={allRegistros} settings={settings} activeKey={activeKey}/>
          </div>
        )}

        {tab==="historial"&&(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div className="card" style={{background:"#0a1a0a",border:"1px solid #1a3a1a"}}>
              <div style={{fontWeight:800,fontSize:13,color:"#6fcf6f",marginBottom:6}}>📊 Datos en Google Sheets</div>
              <div style={{fontSize:12,color:"#555",lineHeight:1.8}}>
                Tus registros se guardan en tu planilla. Puedes verlos en Sheets en cualquier momento.
              </div>
            </div>
            {historyMonths.length===0&&(
              <div className="card" style={{textAlign:"center",padding:40,color:"#2a2a35"}}>
                <div style={{fontSize:32,marginBottom:8}}>🗂</div>
                <div style={{fontSize:14}}>Sin meses anteriores aún.</div>
              </div>
            )}
            {historyMonths.map(key=>{
              const [y,m]=key.split("-").map(Number);
              const regs=allRegistros.filter(r=>r.date.startsWith(key)).sort((a,b)=>a.date.localeCompare(b.date));
              const s=calcStats(regs);
              const isOpen=histTab===key;
              return (
                <div key={key} className="card" style={{padding:0,overflow:"hidden"}}>
                  <div onClick={()=>setHistTab(isOpen?null:key)}
                    style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",userSelect:"none"}}>
                    <div style={{width:44,height:44,borderRadius:12,background:"#1e1e26",border:"1px solid #2a2a35",
                      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <div style={{fontSize:10,fontWeight:800,color:"#444",fontFamily:"'DM Mono',monospace"}}>{MONTHS[m-1].slice(0,3).toUpperCase()}</div>
                      <div style={{fontSize:13,fontWeight:900,color:"#e8c84a",fontFamily:"'DM Mono',monospace"}}>{y}</div>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:14,color:"#e8e4dc"}}>{MONTHS[m-1]} {y}</div>
                      <div style={{fontSize:11,color:"#444",fontFamily:"'DM Mono',monospace"}}>
                        {regs.length} días · {s.lv+s.sab}h · {fmtCLP(s.bruto)}
                      </div>
                    </div>
                    <div style={{fontSize:18,color:"#333",transform:isOpen?"rotate(90deg)":"none",transition:"transform .2s"}}>›</div>
                  </div>
                  {isOpen&&(
                    <div style={{borderTop:"1px solid #1e1e26"}}>
                      <div style={{display:"flex",gap:8,padding:"12px 16px",background:"#0f0f13"}}>
                        <button onClick={()=>handleExport(regs,y,m-1)} style={{flex:1,padding:"10px 0",borderRadius:10,
                          border:"1px solid #2d5a2d",background:"#1a3a1a",color:"#6fcf6f",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                          📥 Exportar Excel
                        </button>
                        <button onClick={()=>deleteMonth(key)} style={{padding:"10px 14px",borderRadius:10,
                          border:"1px solid #3a1a1a",background:"#0f0f13",color:"#ef5350",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                          🗑
                        </button>
                      </div>
                      <div style={{display:"flex",borderTop:"1px solid #1e1e26"}}>
                        {[["L–V",`${s.lv}h`,fmtCLP(s.vLV)],["Sáb",`${s.sab}h`,fmtCLP(s.vSab)],[settings.boleta?"Neto":"Bruto","",fmtCLP(settings.boleta?s.neto:s.bruto)]].map(([l,h,v],i)=>(
                          <div key={i} style={{flex:1,padding:"12px 8px",textAlign:"center",
                            borderRight:i<2?"1px solid #1e1e26":"none",background:i===2?"#1a1800":"#18181f"}}>
                            <div style={{fontSize:9,color:"#444",marginBottom:3,fontFamily:"'DM Mono',monospace"}}>{l}</div>
                            <div style={{fontSize:15,fontWeight:900,color:i===2?"#e8c84a":"#e8e4dc",fontFamily:"'DM Mono',monospace"}}>{h}</div>
                            <div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>{v}</div>
                          </div>
                        ))}
                      </div>
                      {regs.map((r,i)=>{
                        const t=tarifaDia(r.date, settings); const isSab=t.esSabado; const cc=getCentroColor(r.centro);
                        return (
                          <div key={r.id||i} style={{display:"flex",alignItems:"center",padding:"9px 16px",
                            borderTop:"1px solid #1e1e26",background:i%2===0?"#18181f":"#1b1b22"}}>
                            <div style={{width:34,height:34,borderRadius:8,marginRight:10,flexShrink:0,
                              background:"#0f0f13",border:"1px solid #2a2a35",
                              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                              <div style={{fontSize:12,fontWeight:900,color:isSab?"#ef5350":"#5c6bc0",
                                lineHeight:1,fontFamily:"'DM Mono',monospace"}}>{r.date.split("-")[2]}</div>
                              <div style={{fontSize:7,fontWeight:700,color:"#333"}}>{r.dia.slice(0,3).toUpperCase()}</div>
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontWeight:700,fontSize:11,color:cc.text,
                                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.centro}</div>
                            </div>
                            <div style={{color:isSab?"#ef5350":"#7c7cdf",fontWeight:900,
                              fontSize:13,fontFamily:"'DM Mono',monospace"}}>{r.horas}h</div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showSettings&&(
        <SettingsModal settings={settings} onSave={handleSaveSettings} onClose={()=>setShowSettings(false)}/>
      )}
      {confirm&&(
        <ConfirmModal msg={confirm.msg} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>
      )}
      {toast&&(
        <div style={{position:"fixed",bottom:30,left:"50%",transform:"translateX(-50%)",
          background:toast.type==="err"?"#1a0a0a":"#0a1a0a",
          border:`1px solid ${toast.type==="err"?"#5a1a1a":"#1a5a1a"}`,
          color:toast.type==="err"?"#ef5350":"#6fcf6f",
          padding:"11px 26px",borderRadius:30,fontSize:13,fontWeight:700,
          boxShadow:"0 4px 24px #0009",animation:"fadeUp .2s ease",whiteSpace:"nowrap",zIndex:999,
          fontFamily:"'DM Mono',monospace"}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
