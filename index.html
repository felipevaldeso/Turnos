}

// ── FERIADOS CHILE AUTOMÁTICOS ────────────────────────────────
function feriadosChile(y) {
  const fer = new Set();
  const fstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const add = (m, d) => fer.add(fstr(new Date(y, m-1, d)));

  add(1,1);   // Año Nuevo
  add(5,1);   // Día del Trabajo
  add(5,21);  // Glorias Navales
  const diaPueblos = (y % 4 === 0 && y > 2044) ? 20 : 21;
  add(6, diaPueblos);
  add(7,16);  // Virgen del Carmen
  add(8,15);  // Asunción de la Virgen
  add(9,18);  // Independencia
  add(9,19);  // Glorias del Ejército
  add(11,1);  // Todos los Santos
  add(12,8);  // Inmaculada Concepción
  add(12,25); // Navidad

  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
    const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
    const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
    const mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
    return new Date(y,mo-1,dy);
  }
  const ep = easter(y);
  const shift = (days) => { const x = new Date(ep); x.setDate(ep.getDate()+days); fer.add(fstr(x)); };
  shift(-2); // Viernes Santo
  shift(-1); // Sábado Santo

  const trasladaLey19668 = (mes, dia) => {
    const base = new Date(y, mes-1, dia);
    const dw = base.getDay();
    let out = base;
    if (dw >= 2 && dw <= 4) {
      out = new Date(base); out.setDate(dia - (dw - 1));
    } else if (dw === 5) {
      out = new Date(base); out.setDate(dia + 3);
    }
    fer.add(fstr(out));
  };
  trasladaLey19668(6, 29);
  trasladaLey19668(10, 12);

  (() => {
    const base = new Date(y, 9, 31);
    const dw = base.getDay();
    let out = base;
    if (dw === 2 || dw === 3) {
      out = new Date(y, 9, 27);
    }
    fer.add(fstr(out));
  })();

  return fer;
}

const FER_CACHE = {};
function getFer(y){ if(!FER_CACHE[y]) FER_CACHE[y] = feriadosChile(y); return FER_CACHE[y]; }
function esFeriado(f){
  const parts = String(f).split('-').map(Number);
  if(parts.length<3 || parts.some(isNaN)) return false;
  const [yy,mm,dd] = parts;
  const norm = `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  return getFer(yy).has(norm);
}

// ── LÓGICA DE TARIFAS UNIFICADA ──────────────────────────────
function tarifaDia(dateStr, settings) {
  const w = dateStr ? new Date(dateStr+"T12:00:00").getDay() : -1;
  const esSabado = w === 6;
  let horas = 0;
  if (w === 0)              horas = 0;
  else if (w === 5 || w === 6) horas = 4;
  else                      horas = 3;
  const valorHora = esSabado ? settings.valorSab : settings.valorLV;
  return {
    horas,
    esSabado,
    valorHora,
    tipo: esSabado ? "Sábado" : "Lun–Vie",
    total: horas * valorHora,
  };
}

function toSheetRow(r, mk, settings) {
  const t = tarifaDia(r.date, settings);
  return { ID: r.id||genId(), Fecha: r.date, Día: r.dia, Centro: r.centro, Horas: r.horas, Tipo: t.tipo, Mes: mk };
}
function normalizeDate(raw) {
  if(!raw) return "";
  const s = String(raw).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2) return m2[3]+"-"+m2[2].padStart(2,"0")+"-"+m2[1].padStart(2,"0");
  return s;
}
function fromSheetRow(row) {
  return {
    id:     row["ID"]     || row["id"]    || "",
    date:   normalizeDate(row["Fecha"]   || row["fecha"] || ""),
    dia:    row["Día"]    || row["Dia"]   || "",
    centro: row["Centro"] || row["centro"]|| "",
    horas:  Number(row["Horas"] || row["horas"] || 0),
  };
}
function parseSettings(raw) {
  const defaults = { valorLV:DEFAULT_VALOR_LV, valorSab:DEFAULT_VALOR_SAB, factor:DEFAULT_FACTOR, boleta:false, centros:DEFAULT_CENTROS };
  if(!raw || Object.keys(raw).length===0) return defaults;
  return {
    valorLV:  raw.valorLV  ? Number(raw.valorLV)  : defaults.valorLV,
    valorSab: raw.valorSab ? Number(raw.valorSab) : defaults.valorSab,
    factor:   raw.factor   ? Number(raw.factor)   : defaults.factor,
    boleta:   raw.boleta   === "true" || raw.boleta === true,
    centros:  raw.centros  ? (typeof raw.centros==="string" ? JSON.parse(raw.centros) : raw.centros) : defaults.centros,
  };
}

function exportToExcel(registros, year, month, settings) {
  const wb = XLSX.utils.book_new();
  const rows = [["N°","Fecha","Día","Centro","Tipo día","Horas","Valor hora","Total"]];
  registros.forEach((r,i) => {
    const t = tarifaDia(r.date, settings);
    rows.push([i+1, r.date.split("-").reverse().join("/"), r.dia, r.centro, t.tipo, r.horas, t.valorHora, r.horas*t.valorHora]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  ws1["!cols"] = [{wch:4},{wch:13},{wch:12},{wch:16},{wch:10},{wch:7},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws1, "Registros");
  const por = {};
  settings.centros.forEach(c => { por[c]={lv:0,sab:0}; });
  registros.forEach(r => {
    const t = tarifaDia(r.date, settings);
    if(!por[r.centro]) por[r.centro]={lv:0,sab:0};
    if(t.esSabado) por[r.centro].sab+=r.horas; else por[r.centro].lv+=r.horas;
  });
  let tLV=0,tSab=0;
  const rrows=[["Centro","Horas L–V","Horas Sáb","Total h","Valor L–V","Valor Sáb","Total $"]];
  settings.centros.forEach(c => {
    const {lv,sab}=por[c]||{lv:0,sab:0};
    if(!lv&&!sab) return;
    tLV+=lv; tSab+=sab;
    rrows.push([c,lv,sab,lv+sab,lv*settings.valorLV,sab*settings.valorSab,lv*settings.valorLV+sab*settings.valorSab]);
  });
  rrows.push([]);
  rrows.push(["TOTAL",tLV,tSab,tLV+tSab,tLV*settings.valorLV,tSab*settings.valorSab,tLV*settings.valorLV+tSab*settings.valorSab]);
  const ws2 = XLSX.utils.aoa_to_sheet(rrows);
  ws2["!cols"]=[{wch:16},{wch:12},{wch:12},{wch:10},{wch:13},{wch:13},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, "Resumen");
  XLSX.writeFile(wb, `Finanzas_${MONTHS[month]}_${year}.xlsx`);
}

function Calendar({ year, month, marked, selected, onSelect }) {
  const first = new Date(year,month,1).getDay();
  const days  = new Date(year,month+1,0).getDate();
  const cells = Array(first).fill(null);
  for(let d=1;d<=days;d++) cells.push(d);
  const str = d => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:8}}>
        {DAYS_SHORT.map(d=>(
          <div key={d} style={{textAlign:"center",fontSize:10,color:"#444",fontWeight:700,
            fontFamily:"'DM Mono',monospace",padding:"3px 0"}}>{d}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={i}/>;
          const s=str(d), reg=marked.get(s), isSel=s===selected;
          const w=new Date(s+"T12:00:00").getDay(), isDom=w===0;
          const isFer=esFeriado(s);
          const cc = reg ? getCentroColor(reg.centro) : null;
          const blocked = isDom || isFer;
          return (
            <button key={i} onClick={()=>!blocked&&onSelect(s)} style={{
              border: isSel?"2px solid #e8c84a":reg?`2px solid ${cc.border}`:isFer?"1.5px solid #3a1a1a":"1.5px solid transparent",
              borderRadius:10, padding:"7px 0", cursor:blocked?"default":"pointer",
              fontSize:12, fontWeight:reg?800:500, fontFamily:"'DM Mono',monospace",
              background: isSel?"#2a2510":reg?cc.bg:isFer?"#1a0a0a":w===6?"#141418":"#1e1e26",
              color: isSel?"#e8c84a":reg?cc.text:isDom?"#2a2a2a":isFer?"#5a2a2a":w===6?"#555":"#aaa",
              position:"relative",transition:"all .12s",
            }}>
              {d}
              {reg&&!isSel&&(
                <span style={{position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)",
                  width:5,height:5,borderRadius:"50%",background:cc.dot,display:"block"}}/>
              )}
            </button>
          );
        })}
      </div>
      {marked.size>0&&(
        <div style={{marginTop:12,padding:"8px 10px",background:"#1a1a22",borderRadius:8,
          display:"flex",flexWrap:"wrap",gap:6}}>
          {[...new Set([...marked.values()].map(r=>r.centro))].map(c=>{
            const cc=getCentroColor(c);
            const n=[...marked.values()].filter(r=>r.centro===c).length;
            return(
              <div key={c} style={{display:"flex",alignItems:"center",gap:4,
                padding:"3px 8px",borderRadius:20,background:cc.bg,border:`1px solid ${cc.border}`}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:cc.dot}}/>
                <span style={{fontSize:10,color:cc.text,fontWeight:700}}>{c.split(" ")[0]} · {n}d</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

}
